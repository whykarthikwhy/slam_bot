slam_toolbox:
  ros__parameters:

    # --- Frame names (MUST match your URDF/TF tree) ---
    use_sim_time: true
    odom_frame: odom
    map_frame: map
    base_frame: base_link        # or base_footprint
    scan_topic: /scan            # must match your lidar topic

    # --- Mode ---
    mode: mapping                # 'mapping' or 'localization'

    # --- Scan matching ---
    use_scan_matching: true      # always true — refines odometry with lidar
    use_scan_barycenter: true

    # --- When to add a new node to the pose graph ---
    minimum_travel_distance: 0.5    # meters between nodes (lower = denser map)
    minimum_travel_heading: 0.5     # radians between nodes
    scan_buffer_size: 10            # scans to keep in buffer

    # --- Loop closure ---
    loop_search_maximum_distance: 3.0   # how far to look for loop closures
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # --- Correlation parameters (scan matcher sensitivity) ---
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # --- Map resolution and size ---
    resolution: 0.05             # meters/cell (0.05 = 5cm — standard)
    max_laser_range: 10.0        # clip lidar beyond this (match your sensor)

    # --- Serialization ---
    stack_size_to_use: 40000000  # needed for save/load of pose graphs

    num_threads: 16